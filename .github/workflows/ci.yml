name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      has_app: ${{ steps.exists.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4 # pinned major version
      - id: exists
        run: |
          if [ -f "app/pubspec.yaml" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi
      - id: filter
        uses: dorny/paths-filter@v3 # pinned major version
        with:
          filters: |
            api:
              - 'api/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4 # pinned major version
      - uses: actions/setup-node@v4 # pinned major version
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  app:
    needs: changes
    if: needs.changes.outputs.has_app == 'true' && (needs.changes.outputs.app == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4 # pinned major version
      - uses: subosito/flutter-action@v2 # pinned major version
        with:
          flutter-version: "3.29.0" # HYPOTHESE: confirm with App Lead at T01
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4 # pinned major version
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2 # pinned major version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required:
    needs: [api, app, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.api.result }}" = "failure" ] || [ "${{ needs.api.result }}" = "cancelled" ]; then exit 1; fi
          if [ "${{ needs.app.result }}" = "failure" ] || [ "${{ needs.app.result }}" = "cancelled" ]; then exit 1; fi
          if [ "${{ needs.secrets.result }}" = "failure" ] || [ "${{ needs.secrets.result }}" = "cancelled" ]; then exit 1; fi
          echo "All applicable CI checks passed."
