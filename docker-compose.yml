# Local development stack: API (hot reload) + MongoDB.
#   cp .env.docker.example .env && docker compose up --build
# MongoDB runs as a single-node replica set because the API uses transactions.
services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./api
      target: dev
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/evalio?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (32+ characters)}
    ports:
      - "3000:3000"
    # Hot reload: sources are mounted, node_modules stays inside the image.
    volumes:
      - ./api/src:/app/src
      - ./api/test:/app/test

volumes:
  mongo-data:
